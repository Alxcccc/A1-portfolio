<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A1</title>
    <style>
        :root {
            /* Updated colors based on image_f16e2d.png */
            --bg-color: #121312;      /* The dark background from image_f16e2d.png */
            --text-primary: #a68452;   /* The gold/bronze text color */
            --border-accent: #931a14;  /* The red border color */
            --glow: 0 0 5px rgba(147, 26, 20, 0.5);
        }

        a:visited {
        color: inherit; /* Mantiene el color padre */
    }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }

        .terminal-card {
            width: 450px;
            border: 2px solid var(--border-accent);
            padding: 15px;
            position: relative;
            box-shadow: var(--glow);
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-bottom: 1px solid var(--border-accent);
            padding-bottom: 5px;
            margin-bottom: 10px;
            color: var(--border-accent); /* Headers in red to match the "signal" vibe */
        }

        .officer-name {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 10px 0;
            color: var(--text-primary);
        }

        /* Profile Layout */
        .profile-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            border-bottom: 1px solid var(--border-accent);
            padding-bottom: 15px;
        }

       .photo-frame {
            border: 1px solid var(--border-accent);
            width: 100%;
            aspect-ratio: 4/5;
            /* Update: Refers to the new photo verbatim */
            background-image: url('a1_photo.png'); 
            background-size: cover;
            background-position: center;
            /* Monochromatic filter adjusted for the red and gold palette */
        }

        .stats-panel {
            font-size: 12px;
            line-height: 1.6;
        }

        .checkbox-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .box {
            width: 15px;
            height: 15px;
            border: 1px solid var(--border-accent);
        }

        /* Authorization Text */
        .auth-text {
            font-size: 13px;
            padding: 15px 5px;
            line-height: 1.4;
            text-align: justify;
            border-bottom: 1px solid var(--border-accent);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 10px;
            padding-top: 10px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--border-accent);
        }

        .glyph { font-size: 18px; color: var(--border-accent); }
    </style>
</head>
<body>

<div class="terminal-card">
    <div class="header">
        <div>A1</div>
        <div>SIGNAL LOW [||||]</div>
    </div>
    
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--border-accent);">
        <span>CODER</span>
        <span>ACCESS: *********</span>
    </div>
    
    <div class="officer-name">ALEC ECHAVARRÍA</div>

    <div class="profile-container">
        <div class="photo-frame"></div>
        <div class="stats-panel">
            <div class="checkbox-container">
                <span>HUMAN</span>
                <div class="box"></div>
            </div>
            <div style="color: var(--border-accent);">GITHUB LINK</div>
            <div style="font-weight: bold; margin-bottom: 10px;"><a href="https://github.com/Alxcccc">Alxcccc</a></div>
            <div></div>
            <div style="font-weight: bold;">BACKEND CODER</div>
            <div>TUTTO PASSA</div>
        </div>
    </div>

    <div class="auth-text">
        DO YOU WANT ME TO THINK? THE THING THAT KILLED SOCRATES?
    </div>

    <div class="footer">
        <span class="glyph">🥷</span>
        <span>A1EC</span>
        <span class="glyph">👨‍💻</span>
    </div>
</div>

</body>
</html>
